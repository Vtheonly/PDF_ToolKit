[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdftoolkit"
version = "2.0.0"
description = "Unified headless PDF engine: search, extract, merge, render and speech-synthesise PDFs through one JSON API."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "pdftoolkit contributors" }]
keywords = ["pdf", "search", "merge", "render", "text-to-speech", "headless", "engine"]
dependencies = [
    "PyMuPDF>=1.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "httpx>=0.24",
]
speech = [
    "pyttsx3>=2.90",
]
http = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "python-multipart>=0.0.9",
]
all = [
    "pdftoolkit[dev,speech,http]",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pdftoolkit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"

[tool.coverage.run]
source = ["pdftoolkit"]

[tool.coverage.report]
show_missing = true
