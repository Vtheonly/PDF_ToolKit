<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:5050"
    />
    <title>PDF Search & Extract</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- Header -->
      <header class="header">
        <div class="header-left">
          <div class="logo">
            <svg
              width="32"
              height="32"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
              ></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
          </div>
          <h1>PDF Search & Extract</h1>
        </div>
        <div class="header-right">
          <div class="status-indicator" id="statusIndicator">
            <span class="status-dot"></span>
            <span class="status-text">Ready</span>
          </div>
        </div>
      </header>

      <!-- Main Content -->
      <div class="main-content">
        <!-- Sidebar -->
        <aside class="sidebar">
          <!-- Upload Section -->
          <div class="sidebar-section">
            <h3>PDF File</h3>
            <div class="upload-area" id="uploadArea">
              <div class="upload-icon">
                <svg
                  width="48"
                  height="48"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                >
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                  <polyline points="17 8 12 3 7 8"></polyline>
                  <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
              </div>
              <p class="upload-text">Click to select PDF</p>
              <p class="upload-hint">or drag and drop</p>
            </div>
            <div class="file-info" id="fileInfo" style="display: none">
              <div class="file-name" id="fileName"></div>
              <div class="file-pages" id="filePages"></div>
              <button class="btn btn-text" id="clearFile">Change file</button>
            </div>
          </div>

          <!-- Keywords Section -->
          <div class="sidebar-section">
            <h3>Keywords</h3>
            <div class="keywords-input-container">
              <textarea
                id="keywordsInput"
                placeholder="Enter keywords (one per line or comma-separated)"
                rows="4"
              ></textarea>
            </div>
            <div class="search-options">
              <label class="checkbox-label">
                <input type="checkbox" id="caseSensitive" />
                <span>Case sensitive</span>
              </label>
            </div>
            <button class="btn btn-primary" id="searchBtn" disabled>
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              Search Keywords
            </button>
          </div>

          <!-- Results Summary -->
          <div
            class="sidebar-section"
            id="resultsSection"
            style="display: none"
          >
            <h3>Results Summary</h3>
            <div class="results-stats">
              <div class="stat-item">
                <span class="stat-value" id="matchedPagesCount">0</span>
                <span class="stat-label">Pages with matches</span>
              </div>
              <div class="stat-item">
                <span class="stat-value" id="totalMatchesCount">0</span>
                <span class="stat-label">Total matches</span>
              </div>
              <div class="stat-item">
                <span class="stat-value" id="selectedPagesCount">0</span>
                <span class="stat-label">Selected for export</span>
              </div>
            </div>
          </div>

          <!-- Export Section -->
          <div class="sidebar-section" id="exportSection" style="display: none">
            <h3>Export</h3>
            <div class="selection-controls">
              <button class="btn btn-sm" id="selectAllBtn">Select All</button>
              <button class="btn btn-sm" id="deselectAllBtn">
                Deselect All
              </button>
            </div>
            <button class="btn btn-success" id="exportBtn" disabled>
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
              Export PDF
            </button>
          </div>
        </aside>

        <!-- Page Grid -->
        <main class="page-grid-container">
          <div
            class="page-grid-header"
            id="pageGridHeader"
            style="display: none"
          >
            <h2>Pages</h2>
            <div class="page-grid-legend">
              <span class="legend-item">
                <span class="legend-dot matched"></span> Direct match
              </span>
              <span class="legend-item">
                <span class="legend-dot padding"></span> Padding context
              </span>
            </div>
          </div>

          <!-- Empty State -->
          <div class="empty-state" id="emptyState">
            <svg
              width="80"
              height="80"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <h2>No PDF loaded</h2>
            <p>Upload a PDF and enter keywords to start searching</p>
          </div>

          <!-- Loading State -->
          <div class="loading-state" id="loadingState" style="display: none">
            <div class="spinner"></div>
            <p id="loadingText">Processing...</p>
          </div>

          <!-- Page Grid -->
          <div class="page-grid" id="pageGrid"></div>
        </main>
      </div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
