name: CI

# Single-branch policy (ADR-0001): everything lands on main; run on push.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  python-suite:
    name: Python engine (pytest, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 = oldest supported (pyproject requires-python), 3.12 = current dev env.
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install engine + test tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,http]"
      - name: Run the full test suite
        run: pytest

  native-release:
    name: Native core (release, zero warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure (Ninja, C++20, warnings-as-errors)
        run: cmake --preset release -DPython3_EXECUTABLE="$(which python)"
      - name: Build
        run: cmake --build --preset release
      - name: Test
        run: ctest --preset release
      # Audit task 0.2: automated benchmark run on every push. perf stat is
      # expected to be SKIPPED on hosted runners (U-010); the latency
      # benchmarks must still run and pass.
      - name: Benchmarks (audit task 0.2)
        run: scripts/run_perf.sh --json build/release/native/benchmarks/reports build/release/native/benchmarks

  native-asan:
    name: Native core (AddressSanitizer + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Sanitizers on ubuntu-24.04 runners can fail to map shadow memory
      # under high-entropy ASLR (known runner-images issue); reduce entropy.
      - name: Reduce ASLR entropy for sanitizers
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Configure (ASan + UBSan, no-recover)
        run: cmake --preset asan -DPython3_EXECUTABLE="$(which python)"
      - name: Build
        run: cmake --build --preset asan
      - name: Test (zero sanitizer findings required)
        run: ctest --preset asan

  native-tsan:
    name: Native core (ThreadSanitizer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reduce ASLR entropy for sanitizers
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Configure (TSan)
        run: cmake --preset tsan -DPython3_EXECUTABLE="$(which python)"
      - name: Build
        run: cmake --build --preset tsan
      - name: Test (zero sanitizer findings required)
        run: ctest --preset tsan
